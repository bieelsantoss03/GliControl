<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GliControl</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>GliControl🩸</h1>

        <p>Seu diario inteligente de glicemia.</p>


    </header>

    <main>
        <!-- Formulário -->

        <section class="cadastro">

            <h2>Nova Medição</h2>

            <form id="formGlicemia">

                <label for="valor">Glicemia (mg/dl)</label>

                <input
                type="number"
                id="valor"
                placeholder="Ex:120"
                required>

                <label for="momento"></label>

                <select id="momento">

                    <option>Jejum</option>
                    <option>Antes da refeição</option>
                    <option>Depois da refeição</option>
                    <option>Antes de dormir</option>



                </select>

                <label for="observacao">Observação</label>

                <textarea
                    id="observacao"
                    rows="4"
                    placeholder="Ex: Após caminhada">
                </textarea>

                <button type="submit">

                    Salvar Registro


                </button>


            </form>


        </section>
        <!-- Estatisticas -->

        <section class="estatisticas">

            <h2>Resumo</h2>

            <div class="cards">

                <div class="card">
                    <h3>Média</h3>
                    <p id="media">--</p>
                </div>

                <div class="card">
                    <h3>Maior</h3>
                    <p id="maior">--</p>
                </div>

                <div class="card">
                    <h3>Menor</h3>
                    <p id="menor">--</p>
                </div>

                <div class="card">
                    <h3>Registros</h3>
                    <p id="quantidade">0</p>
                </div>
            </div>
        </section>

        <!-- Histórico -->
         <section class="historico">

            <h2>Histórico</h2>

            <table>

                <thead>

                    <tr>

                        <th>Data</th>
                        <th>Hora</th>
                        <th>Valor</th>
                        <th>Momento</th>
                        <th>Observação</th>
                        <th>Ações</th>

                    </tr>

                </thead>

                <tbody id="tabelaRegistros">


                </tbody>
            </table>


         </section>

    </main>

    <script src="js/script.js"></script>
    
</body>
</html>
